# AYRI DENEY: Hisse/emtia day trade kağıt al-sat (Mag7 + altın/petrol/gümüş; kripto botuyla aynı kurallar, BTC filtresi yok).
# Kripto day trade kağıt al-sat botundan türetildi; aşağıdaki açıklamalar kripto botu içindir:
# Kripto day trade kağıt al-sat botu (S10 geç seans momentum + S13 Lien yanlış kırılma + S15 trend günü
# geri çekilme; yalnız alış, BTC filtresi, ayrı alt hesaplar; 10.000$ sanal, 60 gün: 2026-10-11 → 2026-12-10).
# Her çalıştırmada kağıt döneminin başından bugüne tüm KAPANMIŞ 15dk mumlar backtest koduyla yeniden
# oynatılır; çalıştırma kaçsa bile işlem kaçmaz (bot 7/24 açıkmış gibi sonuç verir).
# Günde 2 kez: 00:41 (kripto UTC günü kapanmış, tüm gün içi işlemler kapanmış) ve 12:41 UTC (yedek).
# Actions ücretsiz kotası diğer botlarla (strateji-sg, swing-sg, algo-sg) ortak olduğu için sık çalıştırılmaz.
# Durum/kayıtlar ayrı dalda: kagit-hisse-durum (main kirlenmez). Günlük rapor GitHub issue'ya yazılır.
name: kagit-hisse
on:
  schedule:
    - cron: "17 21 * * 1-5"  # ABD seansı kapandıktan sonra
    - cron: "17 9 * * 2-6"   # yedek
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: kagit-hisse
  cancel-in-progress: false
jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Durum dalını hazırla
        run: |
          git config --global user.name "kagit-bot"
          git config --global user.email "kagit-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin kagit-hisse-durum >/dev/null; then
            git fetch -q origin kagit-hisse-durum
            git worktree add -q -B kagit-hisse-durum kagit_hisse_durum FETCH_HEAD
          else
            git worktree add -q --orphan -b kagit-hisse-durum kagit_hisse_durum
          fi
          if [ -f kagit_hisse_durum/BITTI ]; then echo "Kağıt dönemi bitti; çalıştırma atlanıyor."; echo "SKIP=1" >> $GITHUB_ENV; fi
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kagit/gereksinimler.txt
      - if: env.SKIP != '1'
        run: pip install -q -r kagit/gereksinimler.txt
      - name: Veri önbelleği
        if: env.SKIP != '1'
        uses: actions/cache@v4
        with:
          path: data/cache
          key: veri-${{ github.run_id }}
          restore-keys: veri-
      - name: Kağıt al-sat motoru (veriyi günceller + yeniden oynatır)
        if: env.SKIP != '1'
        run: KAGIT_AYAR_DIZIN=kagit/hisse python -m kagit.motor --durum kagit_hisse_durum
      - name: Durumu kaydet
        if: env.SKIP != '1'
        run: |
          cd kagit_hisse_durum
          git add -A
          git commit -q -m "durum $(date -u +%FT%H:%MZ)" || exit 0
          git push -q origin kagit-hisse-durum
      - name: Günlük raporu GitHub issue'ya yaz
        if: env.SKIP != '1' && hashFiles('kagit_hisse_durum/gunluk_rapor.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baslik="Kağıt al-sat raporu (day-trade-sg HİSSE/EMTİA deney, 10.000 USD)"
          n=$(gh issue list --state open --limit 50 --json number,title -q ".[] | select(.title==\"$baslik\") | .number" | head -1)
          if [ -z "$n" ]; then
            n=$(gh issue create --title "$baslik" --body "day-trade-sg hisse/emtia DENEY hesabının (Mag7 + altın/petrol/gümüş; kripto botuyla aynı S10/S13/S15 kuralları, BTC filtresi yok; backtest yok) günlük raporları bu konuya yazılır. Gerçek para yoktur." | grep -o '[0-9]*$')
          fi
          gh issue comment "$n" --body-file kagit_hisse_durum/gunluk_rapor.md
          cd kagit_hisse_durum && git rm -q gunluk_rapor.md && git commit -q -m "rapor gönderildi" && git push -q origin kagit-hisse-durum
