[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-algo"
version = "0.1.0"
description = "PDF adaylarından türetilmiş bağımsız backtest, paper-test ve Streamlit panosu"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "streamlit>=1.42,<2",
  "yfinance>=0.2.54,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
codex-algo = "codex_algo.cli:main"
codex-algo-hosted = "codex_algo.hosted:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

