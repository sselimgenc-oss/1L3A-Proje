# Kağıt al-sat botu (algo-sg: A trend kırılımı + B kapitülasyon dönüşü, 10.000$ sanal, 60 gün).
# Saatte iki kez (:13 ve :43) çalışır (GitHub zamanlayıcısı çalıştırmaların çoğunu atladığı için strateji-sg botuyla aynı düzen); her çalıştırmada kağıt dönemi başından bugüne tüm KAPANMIŞ mumlar backtest
# koduyla birebir yeniden oynatılır, bu yüzden çalıştırma sıklığı sonucu değiştirmez (yalnızca güncelliği).
# Durum/kayıtlar ayrı dalda: kagit-durum (main kirlenmez). Günlük rapor GitHub issue'ya yazılır.
name: kagit-al-sat
on:
  schedule:
    - cron: "13 * * * *"  # saat başına yakın dakikalar GitHub'da sık atlanıyor; yoğun olmayan dakikalar
    - cron: "43 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: kagit-algo
  cancel-in-progress: false
jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Durum dalını hazırla
        run: |
          git config --global user.name "kagit-bot"
          git config --global user.email "kagit-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin kagit-durum >/dev/null; then
            git fetch -q origin kagit-durum
            git worktree add -q -B kagit-durum kagit_durum FETCH_HEAD
          else
            git worktree add -q --orphan -b kagit-durum kagit_durum
          fi
          if [ -f kagit_durum/BITTI ]; then echo "Kağıt dönemi bitti; çalıştırma atlanıyor."; echo "SKIP=1" >> $GITHUB_ENV; fi
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: paper/requirements.txt
      - if: env.SKIP != '1'
        run: pip install -q -r paper/requirements.txt
      - name: Canlı veriyi çek (Binance spot + OKX funding)
        if: env.SKIP != '1'
        env: { ALGO_LIVE: kagit_durum/live }
        run: python -m paper.fetch_live
      - name: Kağıt al-sat motoru
        if: env.SKIP != '1'
        env: { ALGO_LIVE: kagit_durum/live }
        run: python -m paper.engine --durum kagit_durum
      - name: Durumu kaydet
        if: env.SKIP != '1'
        run: |
          cd kagit_durum
          if python -c "import json,sys; sys.exit(0 if json.load(open('durum.json')).get('bitti') else 1)" 2>/dev/null; then date -u > BITTI; fi
          git add -A
          git commit -q -m "durum $(date -u +%FT%H:%MZ)" || exit 0
          git push -q origin kagit-durum
      - name: Günlük raporu GitHub issue'ya yaz
        if: env.SKIP != '1' && hashFiles('kagit_durum/gunluk_rapor.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baslik="Kağıt al-sat raporu (algo-sg A+B, 10.000 USD)"
          n=$(gh issue list --state open --limit 50 --json number,title -q ".[] | select(.title==\"$baslik\") | .number" | head -1)
          if [ -z "$n" ]; then
            n=$(gh issue create --title "$baslik" --body "algo-sg kağıt al-sat botunun (A: trend kırılımı, B: kapitülasyon dönüşü) günlük raporları bu konuya yazılır. Gerçek para yoktur." | grep -o '[0-9]*$')
          fi
          gh issue comment "$n" --body-file kagit_durum/gunluk_rapor.md
          cd kagit_durum && git rm -q gunluk_rapor.md && git commit -q -m "rapor gönderildi" && git push -q origin kagit-durum
