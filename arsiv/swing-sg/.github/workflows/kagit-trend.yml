# Trend kolları kağıt al-sat botu (BTC trend + ABD trend portföyü + emtia ETF düşük vol., 10.000$ sanal, 60 gün).
# Swing kağıt botundan (kagit.yml / kagit-durum) tamamen bağımsızdır; yalnızca karşılaştırma için swing özsermayesini okur.
# Günde 1 kez çalışır; her çalıştırmada dönem başından bugüne tüm kapanmış günlük mumlar yeniden oynatılır.
name: kagit-trend
on:
  schedule:
    - cron: "53 1 * * *"  # kripto ve ABD günlük mumları kapanmış olur; ücretsiz kota ortak (~90 dk/ay)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: kagit-trend
  cancel-in-progress: false
jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Durum dalını hazırla
        run: |
          git config --global user.name "kagit-bot"
          git config --global user.email "kagit-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin kagit-trend-durum >/dev/null; then
            git fetch -q origin kagit-trend-durum
            git worktree add -q -B kagit-trend-durum kagit_trend_durum FETCH_HEAD
          else
            git worktree add -q --orphan -b kagit-trend-durum kagit_trend_durum
          fi
          if [ -f kagit_trend_durum/BITTI ]; then echo "Kağıt dönemi bitti; çalıştırma atlanıyor."; echo "SKIP=1" >> $GITHUB_ENV; fi
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kagit/gereksinimler.txt
      - if: env.SKIP != '1'
        run: pip install -q -r kagit/gereksinimler.txt
      - name: Güncel veriyi indir (Yahoo)
        if: env.SKIP != '1'
        run: python scripts/fetch_trend.py
      - name: Swing hesabının özsermayesini al (karşılaştırma için, salt okunur)
        if: env.SKIP != '1'
        run: |
          git fetch -q origin kagit-durum && git show origin/kagit-durum:ozsermaye.csv > kagit_trend_durum/swing_ozsermaye.csv || rm -f kagit_trend_durum/swing_ozsermaye.csv
      - name: Trend kağıt motoru
        if: env.SKIP != '1'
        run: python -m trend.kagit --durum kagit_trend_durum
      - name: Durumu kaydet
        if: env.SKIP != '1'
        run: |
          cd kagit_trend_durum
          git add -A
          git commit -q -m "durum $(date -u +%FT%H:%MZ)" || exit 0
          git push -q origin kagit-trend-durum
      - name: Günlük raporu GitHub issue'ya yaz
        if: env.SKIP != '1' && hashFiles('kagit_trend_durum/gunluk_rapor.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baslik="Kağıt al-sat raporu (swing-sg trend kolları, 10.000 USD)"
          n=$(gh issue list --state open --limit 50 --json number,title -q ".[] | select(.title==\"$baslik\") | .number" | head -1)
          if [ -z "$n" ]; then
            n=$(gh issue create --title "$baslik" --body "swing-sg trend kolları kağıt hesabının (BTC trend, ABD trend portföyü, emtia ETF düşük volatilite) günlük raporları bu konuya yazılır. Swing hesabından bağımsızdır. Gerçek para yoktur." | grep -o '[0-9]*$')
          fi
          gh issue comment "$n" --body-file kagit_trend_durum/gunluk_rapor.md
          cd kagit_trend_durum && git rm -q gunluk_rapor.md && git commit -q -m "rapor gönderildi" && git push -q origin kagit-trend-durum
